<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Payment received</title>
  <style>
    :root {
      --brand: #D00000;
      --bg: #ffffff;
      --card: #f7f7f7;
      --text: #1a1a1a;
      --muted: #666666;
      --border: #e4e4e4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --card: #1e1e1e;
        --text: #f2f2f2;
        --muted: #b0b0b0;
        --border: #2c2c2c;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    main {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 22px;
      text-align: center;
    }
    .brand {
      color: var(--brand);
      font-weight: 800;
      letter-spacing: 0.02em;
      font-size: 14px;
      text-transform: uppercase;
      margin: 0 0 18px;
    }
    .mark {
      width: 64px; height: 64px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: var(--brand);
      color: #ffffff;
      font-size: 34px;
      line-height: 64px;
      font-weight: 700;
    }
    h1 { font-size: 22px; margin: 0 0 10px; }
    p { font-size: 16px; line-height: 1.5; margin: 0 0 8px; }
    .muted { color: var(--muted); font-size: 14px; margin-top: 14px; }
  </style>
</head>
<body>
  <main>
    <p class="brand">Infinite Sports</p>
    <div class="mark" aria-hidden="true">&#10003;</div>
    <h1>Payment received</h1>
    <p>Head back to the Infinite Sports app &mdash; your fantasy access activates within a few seconds.</p>
    <p class="muted">You can close this page.</p>
  </main>
</body>
</html>
