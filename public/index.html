<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="3; url=https://infinitesports.org">
  <title>Infinite Sports</title>
  <style>
    :root { --brand: #D00000; --bg: #ffffff; --text: #1a1a1a; --muted: #666666; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121212; --text: #f2f2f2; --muted: #b0b0b0; }
    }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px 16px; text-align: center;
    }
    h1 { color: var(--brand); font-size: 22px; margin: 0 0 10px; }
    p { color: var(--muted); font-size: 15px; line-height: 1.5; margin: 0; }
    a { color: var(--brand); }
  </style>
</head>
<body>
  <main>
    <h1>Infinite Sports</h1>
    <p>Taking you to <a href="https://infinitesports.org">infinitesports.org</a>&hellip;</p>
  </main>
</body>
</html>
